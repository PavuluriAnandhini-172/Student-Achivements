version: "3.9"
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
